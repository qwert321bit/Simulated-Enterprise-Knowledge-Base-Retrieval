services:
  backend:
    build:
      context: .
      target: backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # 知识库文档、上传文件、Qdrant 数据都放在宿主机，容器重建不会丢
      - ./data:/app/data
      # 模型缓存（BGE-M3 和 Reranker 合计约 4–5 GB），避免每次重新下载
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf_cache:
